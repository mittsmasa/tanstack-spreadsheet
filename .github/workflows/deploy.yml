name: Deploy

# main に入った変更をそのまま本番へ。migration を先に当ててから Worker を出す。
# 必要な repository secrets:
#   CLOUDFLARE_API_TOKEN  Workers Scripts:Edit と D1:Edit を持つ API トークン
#   CLOUDFLARE_ACCOUNT_ID Cloudflare のアカウント ID
on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイは並走させない。後から来たものを取り消さず、順番に流す。
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # スキーマを先に進める。新しいコードが古いスキーマに当たる時間を作らない。
      - name: Apply D1 migrations
        run: pnpm db:migrate:remote

      - name: Build
        run: pnpm build

      - name: Deploy Worker
        run: pnpm exec wrangler deploy
