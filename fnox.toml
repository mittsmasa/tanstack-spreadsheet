# 設定は age で暗号化してこのファイルに直接入っている。復号に使う age 秘密鍵は
# OS keychain にあり、identity で keychain プロバイダ経由で取り出す（他リポジトリと同じ方式）。
# 値の投入は --no-daemon を付けること（デーモン経由だと成功表示のまま書き込まれない）:
#   printf '<value>' | fnox --no-daemon set <KEY>
[providers]
keychain = { type = "keychain", service = "fnox" }
age = { type = "age", recipients = [
  "age1rvnrau0swu4tds583lrzgurxpv20ylvku5tgr2tg3jnqxe3gndfs0m6jp0",
], identity = { provider = "keychain", value = "age-key" } }

[secrets]
BETTER_AUTH_URL = { provider = "age", value = "" }
BETTER_AUTH_SECRET = { provider = "age", value = "" }
GOOGLE_CLIENT_ID = { provider = "age", value = "" }
GOOGLE_CLIENT_SECRET = { provider = "age", value = "" }
